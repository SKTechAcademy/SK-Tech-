<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Tech Interview Dashboard & Job Openings</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="jobs.css">
</head>

<body>

<div class="animated-bg">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>
<div class="particles" id="particles"></div>

<div class="header">

    <img src="logo.jpeg">

    <h1>SK TECH Interview Dashboard</h1>

</div>

    <div class="cards">

    <!-- Cards with additional classes for styling and icons -->
    <div class="card total" onclick="switchInterviewTab('all')" style="cursor: pointer;">
        <h2 id="totalCount">0</h2>
        <p>Upcoming Interviews</p>
    </div>

    <div class="card today" onclick="switchInterviewTab('today')" style="cursor: pointer;">
        <h2 id="todayCount">0</h2>
        <p>Today's Interviews</p>
    </div>

    <div class="card job-new" onclick="filterJobsByAge('new')" style="cursor: pointer;">
        <h2 id="newJobsCount">0</h2>
        <p>New Openings</p>
    </div>

    <div class="card job-old" onclick="filterJobsByAge('old')" style="cursor: pointer;">
        <h2 id="oldJobsCount">0</h2>
        <p>Old Openings</p>
    </div>

</div>

<!-- Home button to navigate back to the main page -->
<div style="margin-top: 20px;">
    <a href="index.html" class="home-btn">Home</a>
</div>

<!-- Interview Scheduling button -->
<div style="margin-top: 15px;">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSephX9KvEW53ZZrLTOTeakP6XC04aN1HCaYoH-l4rN3bwpaJA/viewform" target="_blank" class="schedule-btn">Interview Scheduling</a>
</div>

<!-- Tabs for filtering -->
<div class="tabs">
    <button class="tab-btn active" data-tab="all">All Upcoming</button>
    <button class="tab-btn" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="tomorrow">Tomorrow</button>
    <button class="tab-btn" data-tab="available">Available Slots</button>
    <button class="tab-btn" data-tab="jobs">Job Openings</button>
</div>

<!-- Removed search input as per new requirements -->
<div class="search-section" style="display:none;"></div>

<table>

<thead>

<tr>
<th>ID</th>
<th>Round</th>
<th>Date</th>
<th>From</th>
<th>To</th>
<th>Batch</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<!-- Job Openings Section -->
<div id="jobsContainer" class="jobs-container" style="display:none;">
  <div class="jobs-header">
    <h2>Current Job Openings</h2>
  </div>
  <div id="jobsGrid" class="jobs-grid">
    <!-- Job cards injected here -->
  </div>
</div>

<script src="shared-utils.js"></script>
<script src="dashboard.js"></script>
<script src="jobs.js"></script>
<script>
(function() {
  const particles = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (10 + Math.random() * 20) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.opacity = Math.random() * 0.5 + 0.2;
    particles.appendChild(p);
  }
})();
</script>

<!-- Job Details Modal -->
<div id="jobModal" class="job-modal" style="display:none;">
  <div class="job-modal-content">
    <span class="job-modal-close">&times;</span>
    <div id="jobModalBody"></div>
  </div>
</div>

<!-- Instagram Generator Modal -->
<div id="instaModal" class="job-modal" style="display:none;">
  <div class="job-modal-content insta-modal-content">
    <span class="job-modal-close" onclick="closeInstaModal()">&times;</span>
    <h3>Instagram Post</h3>
    <div id="instaPreview" class="insta-preview"></div>
    <textarea id="instaCaption" class="insta-caption" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-copy" onclick="copyInstaCaption()">Copy Caption</button>
      <button class="btn-close" onclick="closeInstaModal()">Close</button>
    </div>
  </div>
</div>

</body>
</html>
